<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>欧洲历史族群图谱 · European Historical Peoples Atlas</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-title">
          <h1 data-i18n="appTitle">欧洲历史族群图谱</h1>
          <span class="app-subtitle" data-i18n="appSubtitle">拖动时间轴 · 悬停查看区域详情</span>
        </div>
        <div class="app-controls">
          <!-- 窄屏谱系树呼出钮（汉堡，居「几何浏览」左侧；桌面端 CSS 隐藏，geo 模式由 main.ts 内联隐藏）。
               徽标 = 已选族群数（renderTreeBtn 维护） -->
          <button id="tree-toggle" class="btn tree-btn" type="button" aria-label="族群">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <span class="tree-btn-badge" hidden></span>
          </button>
          <button id="mode-toggle" class="btn" type="button">几何浏览</button>
          <div class="seg" id="source-seg" role="group" aria-label="data source"></div>
          <button id="lang-toggle" class="btn ghost" type="button">English</button>
        </div>
      </header>

      <div class="controls-row" id="controls-row">
        <div class="legend" id="legend"></div>
        <div class="filters" id="filters"></div>
      </div>

      <main class="app-main">
        <aside class="people-tree" id="people-tree"></aside>
        <div class="map-wrap" id="map-wrap">
          <div class="map-tooltip" id="map-tooltip" hidden></div>
        </div>
        <aside class="detail-panel" id="detail-panel"></aside>
      </main>

      <footer class="timeline" id="timeline"></footer>
    </div>
    <div class="tree-scrim" id="tree-scrim"></div>
    <div class="boot-overlay" id="boot-overlay">
      <div class="boot-card">
        <div class="boot-title">欧洲历史族群图谱</div>
        <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
        <div class="boot-text" id="boot-text">…</div>
        <div class="boot-hint" id="boot-hint"></div>
      </div>
    </div>
    <script>
      // 启动数据预热：HTML 解析期即发起启动期请求，与模块图加载并行
      //（慢网下省去「模块加载完才开始下载 ~4.5MB」的串行等待）。load.ts 按
      // 完全相同的 URL 消费这里的 Promise，不会重复请求。base 从页面路径推导
      //（页面恒挂在 vite base 下，dev 与构建产物同构；%BASE_URL% 在 dev 不替换，故不用）。
      (function () {
        var b = location.pathname.replace(/[^/]*$/, '');
        var m = (window.__ATLAS_BOOT = new Map());
        m.set(
          b + 'data/peoples/export/atlas.json',
          fetch(b + 'data/peoples/export/atlas.json').then(function (r) {
            if (!r.ok) throw new Error(b + 'data/peoples/export/atlas.json 加载失败：HTTP ' + r.status);
            return r;
          }),
        );
        m.set(
          b + 'data/peoples/export/atlas-geometry.geojson',
          fetch(b + 'data/peoples/export/atlas-geometry.geojson').then(function (r) {
            if (!r.ok) throw new Error(b + 'data/peoples/export/atlas-geometry.geojson 加载失败：HTTP ' + r.status);
            return r;
          }),
        );
        // /config 失败不致命（回退默认源），预热阶段就地吞掉网络错误
        m.set(b + 'config', fetch(b + 'config').catch(function () { return null; }));
      })();
    </script>
    <script type="module" src="/src/frontend/main.ts"></script>
  </body>
</html>
